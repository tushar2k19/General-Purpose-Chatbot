<!-- Shared Header Component -->
<header class="app-header">
  <div class="header-left">
    <!-- Sidebar Toggle Button -->
    <button class="sidebar-toggle-btn" (click)="onToggleSidebar()" title="Toggle Sidebar">
      <i [class]="sidebarCollapsed ? 'fas fa-bars' : 'fas fa-times'"></i>
    </button>

    <!-- World-Class Logo -->
    <div class="logo-container" (click)="goHome()">
      <div class="logo-icon">
        <svg width="40" height="40" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Gradient Definitions -->
          <defs>
            <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
              <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:1" />
              <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
            </linearGradient>
            <linearGradient id="logoGradientHover" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
              <stop offset="50%" style="stop-color:#a855f7;stop-opacity:1" />
              <stop offset="100%" style="stop-color:#f472b6;stop-opacity:1" />
            </linearGradient>
          </defs>
          
          <!-- Abstract AI Brain/Layers Icon -->
          <circle cx="50" cy="50" r="45" fill="url(#logoGradient)" opacity="0.1"/>
          <path d="M30 35 L50 25 L70 35 L50 45 Z" fill="url(#logoGradient)" opacity="0.8"/>
          <path d="M30 50 L50 40 L70 50 L50 60 Z" fill="url(#logoGradient)" opacity="0.9"/>
          <path d="M30 65 L50 55 L70 65 L50 75 Z" fill="url(#logoGradient)"/>
          
          <!-- Connection Lines -->
          <line x1="30" y1="35" x2="30" y2="65" stroke="url(#logoGradient)" stroke-width="2" opacity="0.5"/>
          <line x1="70" y1="35" x2="70" y2="65" stroke="url(#logoGradient)" stroke-width="2" opacity="0.5"/>
          <line x1="50" y1="25" x2="50" y2="75" stroke="url(#logoGradient)" stroke-width="2" opacity="0.3"/>
          
          <!-- Center Glow -->
          <circle cx="50" cy="50" r="8" fill="white" opacity="0.9"/>
          <circle cx="50" cy="50" r="5" fill="url(#logoGradient)"/>
        </svg>
      </div>
      <div class="logo-text">
        <span class="logo-name">ConceptAI</span>
        <span class="logo-tagline">Intelligent Solutions</span>
      </div>
    </div>
  </div>

  <div class="header-right">
    <!-- New Chat Button - Only visible on main-chat component when messages exist -->
    <button 
      *ngIf="showNewChatButton" 
      class="new-chat-btn" 
      (click)="onNewChat()" 
      title="Start New Chat">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M1 4v6h6M23 20v-6h-6"/>
        <path d="M20.49 9A9 9 0 005.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 013.51 15"/>
      </svg>
      <span class="new-chat-text">New Chat</span>
    </button>
  </div>
</header>
