<!-- Shared Header -->
<app-header 
  [sidebarCollapsed]="isSidebarCollapsed" 
  [showNewChatButton]="false"
  (toggleSidebar)="toggleSidebar()">
</app-header>

<!-- Shared Sidebar -->
<app-sidebar 
  [collapsed]="isSidebarCollapsed" 
  [activeMode]="activeMode"
  (toggleCollapse)="toggleSidebar()">
</app-sidebar>

<!-- Modern OCR Page Layout -->
<div class="modern-chat-container">
  <!-- Main Content Area -->
  <main class="main-content">
    <!-- OCR Header -->
    <header class="ocr-header">
      <div class="header-info">
        <h2 class="ocr-title">OCR Text Extraction</h2>
        <p class="ocr-subtitle">Upload an image to extract text using advanced OCR technology</p>
      </div>
    </header>

    <!-- OCR Content Area -->
    <div class="ocr-content-area">
      <!-- Upload Section -->
      <div *ngIf="!selectedImage" class="upload-section">
        <div class="upload-card"
             (dragover)="onDragOver($event)"
             (dragleave)="onDragLeave($event)"
             (drop)="onDrop($event)"
             [class.drag-over]="isDragOver">
          <input type="file" (change)="onFileSelected($event)" accept="image/jpeg,image/jpg,image/png" id="ocr-file-upload" style="display: none;">
          <label for="ocr-file-upload" class="upload-label">
            <div class="upload-icon">
              <svg width="64" height="64" color="Orange" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" >
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                <polyline points="17 8 12 3 7 8"/>
                <line x1="12" y1="3" x2="12" y2="15"/>
              </svg>
            </div>
            <h3>Drag & Drop</h3>
            <p>or browse</p>
            <span class="supported-formats">Supports: JPEG, JPG, PNG</span>
          </label>
        </div>
      </div>

      <!-- Image Preview with Process Button -->
      <div *ngIf="selectedImage && !isProcessing && !ocrResult" class="preview-section">
        <div class="preview-card">
          <div class="preview-image-container">
            <img [src]="selectedImage" alt="Selected Image" class="preview-image">
            <button class="remove-btn" (click)="removeImage()" title="Remove image">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="18" y1="6" x2="6" y2="18"/>
                <line x1="6" y1="6" x2="18" y2="18"/>
              </svg>
            </button>
          </div>
          <button class="process-btn" (click)="processImage()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 12a9 9 0 11-6.219-8.56"/>
            </svg>
            Extract Text from Image
          </button>
        </div>
      </div>

      <!-- Processing State -->
      <div *ngIf="isProcessing" class="processing-section">
        <div class="processing-card">
          <div class="processing-animation">
            <div class="spinner"></div>
          </div>
          <div class="processing-message">
            <h3>{{ processingState.message }}</h3>
            <div class="processing-dots">
              <span class="dot"></span>
              <span class="dot"></span>
              <span class="dot"></span>
            </div>
          </div>
          <div class="progress-bar-container">
            <div class="progress-bar">
              <div class="progress-fill" [style.width.%]="processingState.progress"></div>
            </div>
            <span class="progress-text">{{ processingState.progress }}%</span>
          </div>
        </div>
      </div>

      <!-- OCR Result -->
      <div *ngIf="ocrResult" class="result-section">
        <div class="result-layout">
          <!-- Result Image -->
          <div class="result-image-card">
            <h3>Uploaded Image</h3>
            <div class="result-image-container">
              <img [src]="selectedImage" alt="Processed Image" class="result-image">
            </div>
            <button class="new-upload-btn" (click)="removeImage()">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                <polyline points="17 8 12 3 7 8"/>
                <line x1="12" y1="3" x2="12" y2="15"/>
              </svg>
              Upload New Image
            </button>
          </div>

          <!-- Result Text -->
          <div class="result-text-card">
            <div class="result-header">
              <h3>Extracted Text</h3>
              <button class="copy-btn" (click)="copyToClipboard()" title="Copy to clipboard">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                  <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                </svg>
                Copy
              </button>
            </div>
            <div class="result-text-content" [innerHTML]="ocrResult"></div>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>
